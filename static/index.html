<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WALLPAPER//FINDER</title>
  <meta name="description" content="Find live wallpaper loops on YouTube and paste them into Lively Wallpaper." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="preconnect" href="https://i.ytimg.com" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- ============================ HEADER ============================ -->
  <header class="site-header">
    <h1 class="wordmark">WALLPAPER<span class="slashes">//</span>FINDER</h1>
    <p class="tagline">find live wallpaper loops -&gt; paste into Lively</p>
  </header>

  <main>
    <!-- ============================ SEARCH HERO ============================ -->
    <section class="hero" aria-labelledby="hero-label">
      <h2 id="hero-label" class="visually-hidden">Search for wallpapers</h2>
      <form id="search-form" class="search-row" autocomplete="off">
        <input
          id="search-input"
          class="search-input"
          type="text"
          name="q"
          placeholder="SYNTHWAVE CITY / LOFI RAIN / 4K FOREST..."
          aria-label="Search query"
        />
        <button type="submit" id="search-btn" class="btn btn-accent search-btn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          SEARCH
        </button>
      </form>

      <div class="hero-controls">
        <button
          type="button"
          id="strict-toggle"
          class="toggle"
          role="switch"
          aria-checked="false"
          aria-label="Strict mode: require a wallpaper keyword in the title"
        >
          <span class="toggle-box" aria-hidden="true">
            <svg class="icon check" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </span>
          <span class="toggle-label">STRICT MODE</span>
        </button>
        <span class="hero-hint">filters to titles that explicitly say wallpaper / loop / 4k</span>
      </div>
    </section>

    <!-- ============================ STATUS LINE ============================ -->
    <div id="status" class="status-line" role="status" aria-live="polite"></div>

    <!-- ============================ RESULTS ============================ -->
    <section id="results" class="bento" aria-live="polite" aria-busy="false"></section>
  </main>

  <!-- ============================ FOOTER ============================ -->
  <footer class="site-footer">
    <span>WALLPAPER//FINDER</span>
    <span>NO DOWNLOADS · URLS ONLY · BUILT FOR LIVELY WALLPAPER</span>
  </footer>

  <!-- ============================ PREVIEW MODAL ============================ -->
  <div id="preview" class="modal hidden" role="dialog" aria-modal="true" aria-label="Video preview">
    <div class="modal-box">
      <div class="modal-bar">
        <span id="preview-title" class="modal-title"></span>
        <button id="preview-close" class="btn btn-icon" aria-label="Close preview">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="preview-frame" class="modal-frame"></div>
      <div class="modal-actions">
        <a id="preview-open" class="btn" href="#" target="_blank" rel="noopener">OPEN ON YOUTUBE</a>
        <button id="preview-copy" class="btn btn-accent">COPY URL</button>
      </div>
    </div>
  </div>

  <!-- Card template -->
  <template id="card-template">
    <article class="card">
      <button class="thumb" type="button" aria-label="Preview video">
        <img class="thumb-img" alt="" loading="lazy" decoding="async" />
        <span class="score-badge" aria-label="Wallpaper score"></span>
        <span class="dur-badge"></span>
        <span class="play-tag" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" focusable="false"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
        </span>
      </button>
      <div class="card-body">
        <h3 class="card-title"></h3>
        <div class="card-meta">
          <span class="card-channel"></span>
          <span class="res-badge"></span>
        </div>
        <button class="btn btn-accent copy-btn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="9" y="9" width="11" height="11"></rect>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
          </svg>
          <span class="copy-label">COPY URL</span>
        </button>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
